version: '3.8'

services:
  vimes-inventory-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vimes-inventory-api
    ports:
      - "3000:3000"
    environment:
      - SERVER_PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
