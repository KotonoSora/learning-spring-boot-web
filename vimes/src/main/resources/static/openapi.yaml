          type: string
          format: uuid
        receiptType:
          type: string
          enum: [PURCHASE, INTERNAL_PRODUCTION, OUTSOURCED_PROCESSING, CAPITAL_CONTRIBUTION, INVENTORY_SURPLUS]
        description:
          type: string
          nullable: true
        delivererName:
          type: string
          minLength: 1
        docReference:
          type: string
          nullable: true
        docDate:
          type: string
          format: date
          nullable: true
        docOrigin:
          type: string
          nullable: true
        debitAccount:
          type: string
          nullable: true
        creditAccount:
          type: string
          nullable: true
        totalAmountWords:
          type: string
          nullable: true
        attachedDocCount:
          type: string
          nullable: true
        creatorName:
          type: string
          nullable: true
        storekeeperName:
          type: string
          nullable: true
        chiefAccountantName:
          type: string
          nullable: true
        status:
          type: string
          enum: [DRAFT, CONFIRMED]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReceiptItemInput'

